[project]
name = "bloomberg-market-pulse-ai"
version = "0.1.0"
description = "Real-time market data pipeline from Bloomberg API. LSTM (PyTorch) for pattern detection an"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
